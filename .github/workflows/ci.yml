name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pulse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: pulse/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: panel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: ADAPTER=node pnpm run build
      - run: ADAPTER=cloudflare pnpm run build
