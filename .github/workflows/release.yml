name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed for `gh release create`

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tag history

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: pulse/go.sum

      - name: Test
        run: cd pulse && go vet ./... && go test ./...

      - name: Cross-compile
        run: make build-pulse-linux build-pulse-windows build-pulse-darwin

      - name: Sign and build manifest
        env:
          AXON_SIGNING_KEY: ${{ secrets.AXON_SIGNING_KEY }}
        run: |
          cd pulse
          echo "platform,file,sha256,signature_hex" > ../dist-manifest.csv
          for entry in "linux/amd64,dist/pulse-linux-amd64" \
                       "windows/amd64,dist/pulse-windows-amd64.exe" \
                       "darwin/arm64,dist/pulse-darwin-arm64"; do
            platform="${entry%%,*}"
            path="${entry#*,}"
            sig=$(go run ./tools/sign "$path")
            sha=$(sha256sum "$path" | cut -d' ' -f1)
            echo "${platform},$(basename "$path"),${sha},${sig}" >> ../dist-manifest.csv
          done

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            pulse/dist/pulse-linux-amd64 \
            pulse/dist/pulse-windows-amd64.exe \
            pulse/dist/pulse-darwin-arm64 \
            dist-manifest.csv \
            --title "${{ github.ref_name }}" \
            --generate-notes

  build-desktop-windows:
    needs: release # append to the release the `release` job just created
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: panel/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: panel/pnpm-lock.yaml

      - name: Install frontend deps
        run: cd panel && pnpm install --frozen-lockfile

      # Unsigned build: no Windows code-signing cert configured yet, so
      # SmartScreen will warn on first run. Fine for now (self-hosted OSS,
      # single admin installing their own build) -- revisit if this needs
      # to look trustworthy to a wider audience.
      - name: Build Tauri app for Windows
        run: cd panel && pnpm run tauri:build

      - name: Upload to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            panel/src-tauri/target/release/bundle/msi/*.msi \
            panel/src-tauri/target/release/bundle/nsis/*.exe \
            --clobber
