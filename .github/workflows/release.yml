name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed for `gh release create`

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs tag history

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: pulse/go.sum

      - name: Test
        run: cd pulse && go vet ./... && go test ./...

      - name: Cross-compile
        run: make build-pulse-linux build-pulse-windows build-pulse-darwin

      - name: Sign and build manifest
        env:
          AXON_SIGNING_KEY: ${{ secrets.AXON_SIGNING_KEY }}
        run: |
          cd pulse
          echo "platform,file,sha256,signature_hex" > ../dist-manifest.csv
          for entry in "linux/amd64,dist/pulse-linux-amd64" \
                       "windows/amd64,dist/pulse-windows-amd64.exe" \
                       "darwin/arm64,dist/pulse-darwin-arm64"; do
            platform="${entry%%,*}"
            path="${entry#*,}"
            sig=$(go run ./tools/sign "$path")
            sha=$(sha256sum "$path" | cut -d' ' -f1)
            echo "${platform},$(basename "$path"),${sha},${sig}" >> ../dist-manifest.csv
          done

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            pulse/dist/pulse-linux-amd64 \
            pulse/dist/pulse-windows-amd64.exe \
            pulse/dist/pulse-darwin-arm64 \
            dist-manifest.csv \
            --title "${{ github.ref_name }}" \
            --generate-notes
